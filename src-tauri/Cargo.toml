[package]
name = "ssix"
version = "1.0.0"
description = "SSIX SSH Client"
authors = []
edition = "2021"

[lib]
name = "ssix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.6"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
ssh2 = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "alloc", "encryption"] }
rand_core = { version = "0.6", features = ["getrandom"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
tauri-plugin-dialog = "2.8"
dashmap = "6.2"

# Audit-4 Phase 6a: ts-rs is a dev-dep only. We gate the
# `#[derive(TS)]` attributes behind `#[cfg_attr(test, derive(TS))]`
# so the macro is never expanded in release builds — TS bindings are
# generated as a side effect of `cargo test` and committed to
# `src/types/generated/`. Keeping ts-rs out of the release crate
# graph avoids pulling its transitive deps into the desktop binary
# and means a future drop of ts-rs is a single-file change.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ts-rs = "12"



[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
