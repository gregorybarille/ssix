name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag and release name suffix, for example v1.0.1"
        required: true
  push:
    tags:
      - "v*"

# Build and test jobs run third-party code, so only publishing can write.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  windows-tests:
    name: Windows Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri
        timeout-minutes: 15

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Give the build its tag's version
        run: node scripts/release-version.mjs

      - name: Build portable executable
        run: npm run tauri build -- --no-bundle

      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: src-tauri/target/release/ssix.exe
          if-no-files-found: error

  macos-tests:
    name: macOS Tests (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri
        timeout-minutes: 15

  macos-build:
    name: macOS Build (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Give the build its tag's version
        run: node scripts/release-version.mjs

      - name: Build macOS DMG
        run: npm run tauri build

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux-build:
    name: Linux Build (x86_64)
    # The oldest runner with WebKitGTK 4.1: its glibc 2.35 is older than
    # Debian 12's, Fedora's and RHEL 10's, so the packages run on all three.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Give the build its tag's version
        run: node scripts/release-version.mjs

      - name: Build .deb, .rpm and AppImage
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - windows-tests
      - windows-build
      - macos-tests
      - macos-build
      - linux-build

    steps:
      # Full history and tags: the notes list the commits since the
      # previous tag.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-exe
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-silicon-dmg
          path: release-assets

      # The Linux artifact keeps the bundler's deb/, rpm/ and appimage/
      # folders, since its files come from more than one directory.
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-packages
          path: release-assets

      - name: Write release notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md

      - name: Publish tagged release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release view "$RELEASE_TAG" >/dev/null 2>&1
          || gh release create "$RELEASE_TAG"
          --verify-tag
          --title "SSIX $RELEASE_TAG"
          --notes-file release-notes.md
          && gh release upload "$RELEASE_TAG" release-assets/ssix.exe release-assets/*.dmg
          release-assets/deb/*.deb release-assets/rpm/*.rpm release-assets/appimage/*.AppImage --clobber
