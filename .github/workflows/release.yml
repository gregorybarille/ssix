name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag and release name suffix, for example v1.0.0-beta.1"
        required: true
        default: "v1.0.0-beta.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  windows-tests:
    name: Windows Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build portable executable
        run: npm run tauri build -- --no-bundle
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: src-tauri/target/release/ssix.exe
          if-no-files-found: error

  macos-tests:
    name: macOS Tests (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

  macos-build:
    name: macOS Build (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build macOS DMG
        run: npm run tauri build
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - windows-tests
      - windows-build
      - macos-tests
      - macos-build

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-exe
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-silicon-dmg
          path: release-assets

      - name: Publish tagged prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release view "$RELEASE_TAG" >/dev/null 2>&1
          || gh release create "$RELEASE_TAG"
          --verify-tag
          --title "SSIX $RELEASE_TAG"
          --notes "Unsigned builds for personal use. Windows: download ssix.exe and run directly (SmartScreen warning expected). macOS Apple Silicon: download the .dmg, open it, drag to Applications (Gatekeeper warning expected — right-click the app and choose Open to bypass)."
          --prerelease
          && gh release upload "$RELEASE_TAG" release-assets/ssix.exe release-assets/*.dmg --clobber
