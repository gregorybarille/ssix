name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag and release name suffix, for example v1.0.0-beta.1"
        required: true
        default: "v1.0.0-beta.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows Portable EXE
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

      - name: Build portable executable
        run: npm run tauri build -- --no-bundle
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Publish tagged prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          gh release view "$RELEASE_TAG" >/dev/null 2>&1
          || gh release create "$RELEASE_TAG"
          --title "SSIX $RELEASE_TAG"
          --notes "Unsigned portable Windows build for personal use. Download ssix.exe from the release assets and run it directly. Windows may show SmartScreen warnings."
          --draft
          --prerelease
          && gh release upload "$RELEASE_TAG" src-tauri/target/release/ssix.exe --clobber
