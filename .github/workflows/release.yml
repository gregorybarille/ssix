name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag and release name suffix, for example v1.0.0-beta.1"
        required: true
        default: "v1.0.0-beta.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows Portable
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SSX ${{ env.RELEASE_TAG }}"
          releaseBody: "Unsigned Windows MSI and portable builds for personal use. Extract the zip and run `ssx.exe` if installation is restricted. Windows may show SmartScreen warnings."
          releaseDraft: true
          prerelease: true
          args: "--bundles msi"

      - run: Compress-Archive -Path src-tauri/target/release/ssx.exe -DestinationPath src-tauri/target/release/ssx-windows-portable.zip -Force

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SSX ${{ env.RELEASE_TAG }}"
          body: "Unsigned Windows MSI and portable builds for personal use. Extract the zip and run `ssx.exe` if installation is restricted. Windows may show SmartScreen warnings."
          draft: true
          prerelease: true
          files: src-tauri/target/release/ssx-windows-portable.zip
