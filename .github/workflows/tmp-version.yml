name: Temporary version check
on: pull_request
jobs:
  windows:
    runs-on: windows-2022
    env:
      RELEASE_TAG: v1.0.0-beta.19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - run: node scripts/release-version.mjs
      - run: npm run tauri build -- --debug --no-bundle
        env:
          VITE_RELEASE_TAG: v1.0.0-beta.19
      - shell: pwsh
        run: |
          $info = (Get-Item src-tauri/target/debug/ssix.exe).VersionInfo
          "FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
  macos:
    runs-on: macos-latest
    env:
      RELEASE_TAG: v1.0.0-beta.19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - run: node scripts/release-version.mjs
      - run: npm run tauri build -- --debug --bundles app
        env:
          VITE_RELEASE_TAG: v1.0.0-beta.19
      - run: |
          plist=src-tauri/target/debug/bundle/macos/ssix.app/Contents/Info.plist
          plutil -extract CFBundleShortVersionString raw "$plist"
          plutil -extract CFBundleVersion raw "$plist"
